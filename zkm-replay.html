<title>ЗКМ · реплей заездов</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--panel:rgba(14,19,27,.90);--ink:#eef3f8;--muted:#8b9bab;--line:rgba(255,255,255,.09);--amber:#ffb020;--amber-soft:rgba(255,176,32,.16);}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
#map{position:absolute;inset:0;background:var(--bg)}
.leaflet-container{background:#0d1117;font-family:Inter,system-ui,sans-serif}
.leaflet-tile{filter:grayscale(.35) contrast(.92) brightness(.95)}
.topbar{position:absolute;top:12px;left:12px;z-index:600;pointer-events:none}
.title{font-family:Oswald,sans-serif;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:15px;line-height:1;background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:9px 12px 8px;box-shadow:0 6px 24px rgba(0,0,0,.4);pointer-events:auto}
.title .sub{display:block;font-family:'JetBrains Mono',monospace;font-weight:500;font-size:10px;letter-spacing:.02em;color:var(--muted);margin-top:5px;text-transform:none}
.title .sub b{color:var(--amber);font-weight:700}
.cards{position:absolute;top:12px;right:12px;z-index:600;display:flex;flex-direction:column;gap:7px;width:216px;max-height:calc(100vh - 150px);overflow-y:auto;padding-right:2px}
.cards::-webkit-scrollbar{width:5px}.cards::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
.card{background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);border-left-width:3px;border-radius:10px;padding:8px 10px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.card .nm{display:flex;align-items:center;gap:6px;font-family:Oswald,sans-serif;font-weight:500;font-size:12.5px;letter-spacing:.01em;line-height:1.1}
.dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.card .nm .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .nm .km{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.card .meta{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--muted);margin:3px 0 6px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{height:4px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.pbar>i{display:block;height:100%;width:0;border-radius:3px;transition:width .12s linear}
.botrow{display:flex;justify-content:space-between;align-items:center;margin-top:5px}
.botrow .spd{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.fin{color:var(--amber);font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:.05em;display:none}
.card.done .fin{display:inline}.card.done .botrow .spd{opacity:.35}
.gap{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 11px;backdrop-filter:blur(8px);box-shadow:0 6px 24px rgba(0,0,0,.4)}
.gap .l{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.gap .v{font-family:Oswald,sans-serif;font-weight:600;font-size:15px;margin-top:3px;line-height:1.1}
.gap .who{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-top:2px}
.gap .note{font-size:9px;color:var(--muted);margin-top:7px;line-height:1.35;border-top:1px solid var(--line);padding-top:6px}
.gap .note span{display:inline-block;width:15px;border-top:2px dashed #9fb0c0;vertical-align:middle;margin-right:4px}
.dock{position:absolute;left:12px;right:12px;bottom:12px;z-index:600;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:11px 14px 12px;box-shadow:0 8px 34px rgba(0,0,0,.5)}
.row1{display:flex;align-items:center;gap:12px}
.clock{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:20px;letter-spacing:.02em;font-variant-numeric:tabular-nums;min-width:104px}
.clock small{display:block;font-size:9px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);border-radius:9px;cursor:pointer;font-family:Inter,sans-serif;font-size:13px;height:38px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background .12s,border-color .12s;-webkit-tap-highlight-color:transparent}
.btn:hover{background:rgba(255,255,255,.09)}.btn:active{transform:translateY(1px)}
.btn.play{width:44px;padding:0;background:var(--amber-soft);border-color:rgba(255,176,32,.4);color:var(--amber)}
.btn.play:hover{background:rgba(255,176,32,.24)}.btn svg{width:16px;height:16px;fill:currentColor;display:block}
.spacer{flex:1}
.speeds{display:flex;gap:4px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:9px;padding:3px}
.speeds button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11px;padding:5px 8px;border-radius:6px;-webkit-tap-highlight-color:transparent}
.speeds button.on{background:var(--amber);color:#241800}
.follow.on{color:var(--amber);border-color:rgba(255,176,32,.4);background:var(--amber-soft)}
.scrubwrap{margin-top:11px;position:relative}
input[type=range]{-webkit-appearance:none;width:100%;height:6px;border-radius:4px;background:transparent;cursor:pointer;margin:6px 0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:4px;background:linear-gradient(90deg,var(--amber) 0 var(--p,0%),rgba(255,255,255,.12) var(--p,0%) 100%)}
input[type=range]::-moz-range-track{height:6px;border-radius:4px;background:rgba(255,255,255,.12)}
input[type=range]::-moz-range-progress{height:6px;border-radius:4px;background:var(--amber)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--amber);margin-top:-5px;box-shadow:0 2px 6px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--amber);box-shadow:0 2px 6px rgba(0,0,0,.5)}
.ticks{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);margin-top:-2px;letter-spacing:.03em}
.rider .core{width:14px;height:14px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.35),0 0 13px 3px var(--glow)}
.rider .ping{position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--glow);animation:ping 1.6s ease-out infinite;opacity:0}
@keyframes ping{0%{transform:scale(.5);opacity:.7}100%{transform:scale(1.7);opacity:0}}
.rider .cap{position:absolute;left:19px;top:-3px;white-space:nowrap;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:10px;color:#fff;background:rgba(13,17,23,.82);border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-variant-numeric:tabular-nums}
.hint{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);z-index:600;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:6px 14px;backdrop-filter:blur(8px);transition:opacity .6s;pointer-events:none}
.hint.hide{opacity:0}
@media (max-width:640px){.cards{width:150px;top:10px;right:10px;max-height:calc(100vh - 132px)}.card{padding:6px 8px}.card .nm{font-size:11px}.card .nm .km{font-size:12px}
  .title{font-size:12px;padding:7px 10px 6px}.clock{font-size:16px;min-width:84px}.btn{height:34px;font-size:12px;padding:0 9px}.btn.play{width:40px}
  .btn.txt span{display:none}.speeds button{padding:5px 6px;font-size:10px}.dock{padding:9px 10px 10px;left:8px;right:8px;bottom:8px}.topbar{left:8px;top:8px}.hint{display:none}.gap .note{display:none}.rider .cap{display:none}}
@media (prefers-reduced-motion:reduce){.rider .ping{animation:none;display:none}}
</style></head>

  const bg=L.polyline(tr.track,{color:col,weight:2,opacity:.26,lineJoin:'round'}).addTo(map);
  (tr.dashed||[]).forEach(seg=>L.polyline(seg,{color:col,weight:2,opacity:.5,dashArray:'3 6',lineCap:'round'}).addTo(map));
  const glow=L.polyline([],{color:col,weight:8,opacity:.15,lineJoin:'round',lineCap:'round'}).addTo(map);
  const prog=L.polyline([],{color:col,weight:3,opacity:.95,lineJoin:'round',lineCap:'round'}).addTo(map);
  const icon=L.divIcon({className:'',iconSize:[14,14],iconAnchor:[7,7],html:`<div class="rider" style="--glow:${col}"><div class="ping"></div><div class="core" style="background:${col}"></div><div class="cap"></div></div>`});
  const mk=L.marker([tr.frames[0][0],tr.frames[0][1]],{icon,zIndexOffset:1000+i,keyboard:false}).addTo(map);
  return {tr,col,glow,prog,mk,cap:null,built:-1,pts:[]};});
const allBounds=L.latLngBounds([]);T.forEach(tr=>tr.track.forEach(p=>allBounds.extend(p)));
map.fitBounds(allBounds,{padding:[40,40]});
setTimeout(()=>layers.forEach(L2=>{const el=L2.mk.getElement();if(el)L2.cap=el.querySelector('.cap');}),0);
const $=s=>document.querySelector(s);
// build cards
const cardsWrap=$('#cards');const cards=[];
T.forEach((tr,i)=>{const d=document.createElement('div');d.className='card';d.style.borderLeftColor=tr.color;
  d.innerHTML=`<div class="nm"><span class="dot" style="background:${tr.color}"></span><span class="t">${tr.short}</span><span class="km">0.0</span></div>
    <div class="meta">${tr.datelabel} · старт ${tr.startMsk}</div>
    <div class="pbar"><i style="background:${tr.color}"></i></div>
    <div class="botrow"><span class="spd">0 км/ч</span><span class="fin">финиш</span></div>`;
  cardsWrap.appendChild(d);cards.push(d);});
const ldr=document.createElement('div');ldr.className='gap';
ldr.innerHTML=`<div class="l">лидер по дистанции</div><div class="v" id="ldrV">—</div><div class="who" id="ldrW"></div>
  <div class="note"><span></span>пунктир — разрыв GPS / стык сессий (оценка)</div>`;
cardsWrap.appendChild(ldr);
const clk=$('#clk'),scrub=$('#scrub');scrub.max=N-1;
function fmt(sec){sec=Math.max(0,Math.round(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
const ticks=$('#ticks');[0,.25,.5,.75,1].forEach(f=>{const s=document.createElement('span');s.textContent=fmt(Math.round((N-1)*f*STEP)).slice(0,-3);ticks.appendChild(s);});
const SPEEDS=[1,5,25,100,300,800];let speed=300,playing=false;const sc=$('#speeds');
SPEEDS.forEach(v=>{const b=document.createElement('button');b.textContent=v+'×';b.dataset.v=v;if(v===speed)b.classList.add('on');
  b.onclick=()=>{speed=v;[...sc.children].forEach(x=>x.classList.toggle('on',+x.dataset.v===v));};sc.appendChild(b);});
let cur=0,follow=false,last=performance.now();
function setPlaying(p){playing=p;$('#icoPlay').style.display=p?'none':'block';$('#icoPause').style.display=p?'block':'none';if(p){$('#hint').classList.add('hide');last=performance.now();}}
$('#play').onclick=()=>{if(cur>=N-1)cur=0;setPlaying(!playing);};
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(cur>=N-1)cur=0;setPlaying(!playing);}});
$('#follow').onclick=function(){follow=!follow;this.classList.toggle('on',follow);};
$('#fit').onclick=()=>{follow=false;$('#follow').classList.remove('on');map.fitBounds(allBounds,{padding:[40,40]});};
scrub.oninput=()=>{cur=+scrub.value;setPlaying(false);render(true);};
function buildTo(L2,f){const fr=L2.tr.frames;if(f<L2.built){L2.pts=[];for(let k=0;k<=f;k++)L2.pts.push([fr[k][0],fr[k][1]]);}else{for(let k=L2.built+1;k<=f;k++)L2.pts.push([fr[k][0],fr[k][1]]);}L2.built=f;L2.prog.setLatLngs(L2.pts);L2.glow.setLatLngs(L2.pts);}
function kmAt(i,f){const fr=layers[i].tr.frames,fi=Math.floor(f),fn=Math.min(N-1,fi+1),r=f-fi;return fr[fi][2]+(fr[fn][2]-fr[fi][2])*r;}
function render(scrubbed){
  const f=Math.min(N-1,cur),fi=Math.floor(f),frac=f-fi,fn=Math.min(N-1,fi+1),elapsed=f*STEP;
  clk.textContent=fmt(elapsed);if(!scrubbed)scrub.value=f;scrub.style.setProperty('--p',(f/(N-1)*100)+'%');
  const posArr=[];let best=-1,bestKm=-1,second=-1;
  layers.forEach((L2,i)=>{const fr=L2.tr.frames,a=fr[fi],b=fr[fn];
    const lat=a[0]+(b[0]-a[0])*frac,lon=a[1]+(b[1]-a[1])*frac,km=a[2]+(b[2]-a[2])*frac;
    L2.mk.setLatLng([lat,lon]);posArr.push([lat,lon]);buildTo(L2,fi);
    const w=8,f0=Math.max(0,fi-w),dkm=fr[fi][2]-fr[f0][2],dt=(fi-f0)*STEP/3600,done=elapsed>=L2.tr.durSec,kmh=done?0:(dt>0?dkm/dt:0);
    const c=cards[i];c.querySelector('.km').textContent=km.toFixed(1);c.querySelector('.spd').textContent=Math.round(kmh)+' км/ч';
    c.querySelector('.pbar>i').style.width=(km/L2.tr.totalKm*100)+'%';c.classList.toggle('done',done);
    if(L2.cap)L2.cap.textContent=km.toFixed(1)+' км';
    if(km>bestKm){second=best;best=i;bestKm=km;}else if(second<0||km>kmAt(second,f)){second=i;}});
  // leader readout
  const lv=$('#ldrV'),lw=$('#ldrW');
  if(best>=0){lv.innerHTML=`<span style="color:${T[best].color}">${T[best].short}</span>`;
    if(second>=0){const gap=Math.abs(bestKm-kmAt(second,f));lw.textContent=`${bestKm.toFixed(1)} км · +${gap.toFixed(1)} км до 2-го`;}
    else lw.textContent=`${bestKm.toFixed(1)} км`;}
  if(follow&&posArr.length){const b=L.latLngBounds(posArr).pad(0.25);map.fitBounds(b,{animate:true,duration:.2,maxZoom:15,padding:[30,30]});}
}
function tick(now){if(playing){const dt=(now-last)/1000;last=now;cur+=dt*speed/STEP;if(cur>=N-1){cur=N-1;setPlaying(false);}render(false);}else{last=now;}requestAnimationFrame(tick);}
render(true);requestAnimationFrame(tick);
</script></body></html>
